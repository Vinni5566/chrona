[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrona"
version = "0.1.0"
description = "Repo-aware graph memory reliability layer for AI incident agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.2.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "pyvis>=0.3.1",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
chrona = "chrona.cli.commands:app"
